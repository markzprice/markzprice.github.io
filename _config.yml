# Jekyll configuration for markrprice.com
# This activates the Jekyll build that GitHub Pages was already running idle.
# Every other HTML file in this repo has no front matter, so Jekyll copies it
# byte-for-byte to _site. Only files with front matter get processed.

title: Margin Notes
description: mark price — the things I keep trying to write in the book of life
url: https://markrprice.com
author: Mark Price
lang: en

# Post URLs are /notes/whatever/ — decided and permanent.
# These get cross-posted; changing this shape breaks every previously shared link.
permalink: /notes/:title/

# Site-wide fallback preview-card image, used when a post has no `image:`.
# UNSET on purpose. While unset, imageless posts emit no og:image at all and
# degrade to a clean text card — which is correct. Do NOT point this at a file
# that doesn't exist: a 404 og:image is worse than none.
# To turn it on: drop a JPEG (NOT WebP — Bluesky can't render WebP cards) into
# /assets/images/, ideally ~1200x630, then uncomment the line below.
# og_default_image: /assets/images/og-default.jpg

# Everything in _posts/ gets the "post" layout automatically.
# Mark should never need to type a layout name in front matter.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Make sure /admin/ (Sveltia CMS) is copied to _site.
# Jekyll ignores nothing here by default, but being explicit is safer.
include:
  - admin

# Keep _site tidy — don't ship dev-time noise.
exclude:
  - Workers
  - README.md
