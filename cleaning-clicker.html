<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cleaning Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Cleaning Clicker — Mark's cleaning counter, arcade-cabinet style. Built 2026-10-09.
   Colours: orange (player 1), purple (player 2), yellow, red, white on near-black. Never blue with green. */
:root{
  --bg:#07040c; --cab:#120a1c; --ink:#fff6e8; --dim:#6e5f80; --rule:#2c1d3d;
  --p1:#ff8a1f; --p1-hot:#ffd08a; --p2:#dc9bff; --p2-hot:#f3dcff;
  --yel:#ffd23f; --red:#ff3b3b; --pink:#ff5fa8;
  --pix:'Press Start 2P', 'Courier New', monospace;
  --art:Menlo, 'DejaVu Sans Mono', Consolas, 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
/* cabinet frame */
/* ---- CRT cabinet: bevelled bezel, curved glass screen, faint grid, glare, twinkling stars ---- */
#cab{position:fixed;inset:0;padding:clamp(14px,3.2vmin,44px);
  background:
    linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(255,255,255,.10) 50%, transparent calc(50% + 1px)) top left / clamp(14px,3.2vmin,44px) clamp(14px,3.2vmin,44px) no-repeat,
    linear-gradient(to bottom left,  transparent calc(50% - 1px), rgba(255,255,255,.10) 50%, transparent calc(50% + 1px)) top right / clamp(14px,3.2vmin,44px) clamp(14px,3.2vmin,44px) no-repeat,
    linear-gradient(to top right,    transparent calc(50% - 1px), rgba(0,0,0,.45) 50%, transparent calc(50% + 1px)) bottom left / clamp(14px,3.2vmin,44px) clamp(14px,3.2vmin,44px) no-repeat,
    linear-gradient(to top left,     transparent calc(50% - 1px), rgba(0,0,0,.45) 50%, transparent calc(50% + 1px)) bottom right / clamp(14px,3.2vmin,44px) clamp(14px,3.2vmin,44px) no-repeat,
    linear-gradient(160deg, #2e2148 0%, #1b1430 45%, #0f0b1c 100%);}
#crt{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;
  border-radius:4% / 6%;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(120,60,170,.0) 0%, rgba(10,4,20,.0) 55%, rgba(5,2,10,.75) 100%),
    radial-gradient(ellipse at 50% 42%, #2a1544 0%, #1a0d2c 55%, #0c0616 100%);
  box-shadow:0 0 0 2px #05030a, 0 0 0 5px #3b2a5c, inset 0 0 70px rgba(0,0,0,.85), inset 0 0 18px rgba(220,155,255,.20);}
#crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    repeating-linear-gradient(0deg,  rgba(255,95,168,.22) 0 1px, transparent 1px 5.5%),
    repeating-linear-gradient(90deg, rgba(255,95,168,.22) 0 1px, transparent 1px 4.2%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.35) 45%, #000 85%);
          mask-image:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.35) 45%, #000 85%);}
#crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:
    linear-gradient(200deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.04) 18%, transparent 30%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);}
#crt > *{position:relative;z-index:2;}
.star{position:absolute;z-index:1;width:4px;height:4px;background:#f3dcff;border-radius:50%;pointer-events:none;
  box-shadow:0 0 6px 2px rgba(243,220,255,.7);animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6);}50%{opacity:1;transform:scale(1.2);}}
#marquee{text-align:center;padding:12px 8px 10px;font-size:clamp(16px,3.2vw,34px);letter-spacing:.12em;
  color:var(--yel);text-shadow:0 0 10px rgba(255,210,63,.8), 3px 3px 0 var(--red);border-bottom:2px solid rgba(255,95,168,.25);flex:none;}
#marquee small{display:block;font-size:.38em;color:var(--dim);letter-spacing:.2em;margin-top:8px;text-shadow:none;}
.screen{flex:1;min-height:0;display:none;}
.screen.on{display:flex;}
button{font-family:var(--pix);cursor:pointer;}
/* ---------- setup ---------- */
#setup{overflow:auto;justify-content:center;padding:18px 14px 40px;}
#setup .col{width:100%;max-width:880px;}
.row{margin:0 0 18px;}
.lab{font-size:11px;color:var(--dim);letter-spacing:.15em;margin:0 0 8px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{background:#1a1028;color:var(--ink);border:3px solid #3a2350;padding:10px 12px;font-size:12px;letter-spacing:.06em;}
.opt.sel{border-color:var(--yel);color:var(--yel);box-shadow:0 0 10px rgba(255,210,63,.45);}
.opt:focus-visible{outline:2px dashed var(--pink);}
input[type=text],input[type=number]{font-family:var(--pix);font-size:12px;background:#0d0716;color:var(--ink);
  border:3px solid #3a2350;padding:10px;width:100%;max-width:340px;}
input:focus{outline:none;border-color:var(--yel);}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
.pcard{border:3px solid var(--rule);padding:14px;}
.pcard.p1{border-color:var(--p1);} .pcard.p2{border-color:var(--p2);}
.pcard h3{margin:0 0 12px;font-size:13px;letter-spacing:.1em;}
.pcard.p1 h3{color:var(--p1);} .pcard.p2 h3{color:var(--p2);}
.mini{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;}
.mini > div{min-width:150px;}
.kidsbtn{align-self:center;margin-left:6px;background:transparent;color:var(--dim);border:2px dashed #3a2350;padding:5px 9px;font-size:9px;letter-spacing:.1em;cursor:pointer;}
.kidsbtn.on{color:var(--pink);border:2px solid var(--pink);box-shadow:0 0 8px rgba(255,95,168,.45);}
.kidsbtn:focus-visible{outline:2px dashed var(--pink);}
.mshint{font-size:9px;color:var(--dim);letter-spacing:.1em;margin-top:10px;line-height:1.8;}
.mini label{font-size:9px;color:var(--dim);display:block;margin-bottom:6px;letter-spacing:.1em;}
.mini input{width:110px;}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.games .opt{text-align:left;font-size:10px;line-height:1.5;}
#start{display:block;margin:24px auto 0;font-size:clamp(16px,2.4vw,24px);padding:18px 34px;background:var(--red);color:#fff;
  border:4px solid var(--yel);box-shadow:0 6px 0 #7a1010;letter-spacing:.12em;animation:blink 1.2s steps(2) infinite;}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 #7a1010;}
.hint{font-size:10px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.8;}
@keyframes blink{50%{filter:brightness(1.35);}}
/* ---------- play ---------- */
#play{flex-direction:column;}
#teambar{display:none;flex:none;text-align:center;padding:10px 8px 6px;border-bottom:3px solid var(--rule);}
#teambar.on{display:block;}
#teambar .tnum{font-size:clamp(30px,8vh,90px);color:var(--yel);text-shadow:0 0 14px rgba(255,210,63,.6);}
#teambar .tsub{font-size:clamp(9px,1.4vw,13px);color:var(--dim);margin-top:6px;letter-spacing:.12em;}
#teambar .tart{margin-top:6px;display:inline-block;text-align:left;font-family:var(--art);font-weight:700;white-space:pre;line-height:1.05;font-size:clamp(10px,2.1vh,26px);}
#squares{flex:1;min-height:0;display:flex;}
.sq{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px;border-right:3px solid var(--rule);transition:background .25s;overflow:hidden;}
.sq:last-child{border-right:none;}
.sq .who{font-size:clamp(12px,2.2vw,26px);letter-spacing:.12em;margin-bottom:6px;}
.sq .goalname{font-size:clamp(9px,1.2vw,13px);color:var(--dim);letter-spacing:.15em;margin-bottom:10px;}
.sq .num{font-size:clamp(60px,22vh,260px);line-height:1;}
.solo .sq .num{font-size:clamp(80px,34vh,380px);}
.sq .of{font-size:clamp(9px,1.4vw,15px);color:var(--dim);margin-top:10px;letter-spacing:.1em;}
.sq .bar{width:86%;height:clamp(10px,2vh,22px);border:3px solid var(--rule);margin-top:14px;}
.sq .bar i{display:block;height:100%;width:0;transition:width .15s;}
.sq .art{margin-top:14px;font-family:var(--art);font-weight:700;white-space:pre;line-height:1.05;
  font-size:clamp(10px,2.3vh,28px);text-align:left;}
.solo .sq .art{font-size:clamp(12px,3.1vh,38px);}
.sq .keycap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.15em;}
.sq.p1 .who,.sq.p1 .num{color:var(--p1);text-shadow:0 0 16px rgba(255,138,31,.7);}
.sq.p2 .who,.sq.p2 .num{color:var(--p2);text-shadow:0 0 16px rgba(220,155,255,.7);}
.sq.p1 .bar i{background:var(--p1);} .sq.p2 .bar i{background:var(--p2);}
.sq.flash.p1{background:rgba(255,138,31,.32);transition:none;}
.sq.flash.p2{background:rgba(192,112,255,.32);transition:none;}
.sq.big.p1{background:rgba(255,210,63,.35);transition:none;} .sq.big.p2{background:rgba(255,95,168,.35);transition:none;}
.sq .won{display:none;position:absolute;top:12px;left:0;right:0;text-align:center;font-size:clamp(12px,2vw,22px);color:var(--yel);animation:blink .6s steps(2) infinite;}
.sq.done .won{display:block;position:static;margin-bottom:6px;}
.sq.done{opacity:.85;}
#toast{position:absolute;left:0;width:100%;top:38%;text-align:center;font-size:clamp(22px,5vw,64px);color:var(--yel);
  text-shadow:4px 4px 0 var(--red);pointer-events:none;opacity:0;z-index:20;}
#toast.go{animation:toast 1.4s ease-out;}
@keyframes toast{0%{opacity:0;transform:scale(.4);}15%{opacity:1;transform:scale(1.15);}30%{transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateY(-30px);}}
#reset{position:absolute;top:8px;right:10px;z-index:30;font-size:9px;padding:8px 10px;background:transparent;color:var(--dim);border:2px solid var(--rule);}
#reset.arm{color:var(--red);border-color:var(--red);}
/* ---------- finish ---------- */
#finish{position:fixed;inset:clamp(14px,3.2vmin,44px);border-radius:4% / 6%;overflow:hidden;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(7,4,12,.86);text-align:center;padding:20px;}
#finish.on{display:flex;}
#finish .f1{font-size:clamp(30px,7vw,96px);color:var(--yel);text-shadow:5px 5px 0 var(--red);animation:blink .5s steps(2) infinite;}
#finish .f0{font-size:clamp(12px,2vw,24px);color:var(--pink);letter-spacing:.2em;margin-bottom:22px;}
#finish .f2{font-size:clamp(14px,2.8vw,36px);margin-top:26px;line-height:1.6;}
#finish .f3{font-size:clamp(10px,1.6vw,18px);margin-top:18px;line-height:2;color:var(--dim);}
#finish .f3 b{font-weight:400;}
#finish .again{margin-top:40px;font-size:clamp(14px,2.4vw,30px);}
#finish .yn{display:flex;gap:40px;justify-content:center;margin-top:22px;}
#finish .yn button{font-size:clamp(14px,2.4vw,30px);background:none;border:none;color:var(--dim);padding:10px 16px;}
#finish .yn button.sel{color:var(--yel);}
#finish .yn button.sel::before{content:"▶ ";}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;}
.stage{display:none;width:100%;flex:1;min-height:90px;margin-top:10px;position:relative;}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
#play.animated .sq .art{display:none;}
#play.animated .sq .stage{display:block;}
#play.animated .sq{justify-content:flex-start;padding-top:16px;padding-bottom:30px;}
#play.animated .sq .num{font-size:clamp(46px,13vh,170px);}
#play.animated.solo .sq .num{font-size:clamp(60px,19vh,230px);}
#play.shared .sq .stage{display:none !important;}
#play.shared .sq{justify-content:center;}
#teambar .stage{height:34vh;flex:none;margin:6px auto 0;max-width:1100px;}
#play.animated #teambar .tart{display:none;}
#play.animated #teambar.on .stage{display:block;}
#play.shared #teambar .tnum,#play.shared #teambar .tsub{display:none;}
#play.shared #teambar .stage{height:40vh;}
.lab.sub2{margin-top:16px;}
</style>
</head>
<body>
<div id="cab"><div id="crt">
  <div id="marquee">CLEANING CLICKER<small id="msub">INSERT EFFORT TO CONTINUE</small></div>

  <!-- SETUP -->
  <div class="screen" id="setup"><div class="col">
    <div class="row"><div class="lab">PLAYERS</div><div class="opts" data-k="players">
      <button class="opt" data-v="1">1 PLAYER</button><button class="opt" data-v="2">2 PLAYERS</button><button type="button" class="kidsbtn" id="kids" aria-pressed="false">KIDS MODE</button></div></div>
    <div class="row" id="moderow"><div class="lab">2-PLAYER MODE</div><div class="opts" data-k="mode">
      <button class="opt" data-v="team">TEAM · ONE TOTAL</button><button class="opt" data-v="separate">SEPARATE · OWN GOALS</button><button class="opt" data-v="race">RACE · FIRST TO FINISH</button></div></div>
    <div class="row"><div class="lab">COUNT</div><div class="opts" data-k="dir">
      <button class="opt" data-v="up">COUNT UP</button><button class="opt" data-v="down">COUNT DOWN</button></div></div>
    <div class="row"><div class="lab">WHAT ARE WE CLEANING?</div><input type="text" id="goalName" maxlength="24" placeholder="KITCHEN"></div>
    <div class="row"><div class="pcards" id="pcards"></div></div>
    <div class="row"><div class="lab">GAME · CLASSIC</div><div class="games opts" data-k="game" id="gamepick"></div>
      <div class="lab sub2">GAME · ANIMATED</div><div class="games opts" data-k="game" id="gamepick2"></div></div>
    <button id="start">PRESS START</button>
    <div class="hint" id="keyhint"></div>
  </div></div>

  <!-- PLAY -->
  <div class="screen" id="play">
    <button id="reset">RESET</button>
    <div id="teambar"><div class="tnum" id="tnum">0</div><div class="tsub" id="tsub"></div><div class="tart art" id="tart"></div><div class="stage" id="tstage"><canvas></canvas></div></div>
    <div id="squares"></div>
    <div id="toast"></div>
  </div>
</div></div>
<div id="finish"><div class="f0" id="fgoal"></div><div class="f1" id="ftitle">YOU DID IT!</div><div class="f2" id="fline"></div><div class="f3" id="fdetail"></div>
  <div class="again">PLAY AGAIN?</div><div class="yn"><button data-yn="yes" class="sel">YES</button><button data-yn="no">NO</button><button data-yn="view">VIEW IT</button></div></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* ================= STATE ================= */
const KEY = "cleaningClicker.v1";
/* goal presets: goal -> [small cheer every, big cheer every]. Kids mode swaps in shorter goals with cheers close together. */
const PRESETS_ADULT = {100:[5,25], 250:[10,50], 500:[25,100], 750:[25,150], 1000:[25,100]};
const PRESETS_KIDS  = {25:[5,10], 50:[5,25], 75:[5,25], 100:[10,25], 150:[10,25]};
let PRESETS = PRESETS_ADULT;
const GAMES = [
  ["dots","DOT-EATER"],["flower","GROW A FLOWER"],["clear","CLEAR A SQUARE"],["race","RACE"],["bubble","BUBBLE WRAP"],
  ["tower","BUILD A TOWER"],["mountain","CLIMB A MOUNTAIN"],["jar","FILL THE JAR"],["rocket","ROCKET"],
  ["picture","HIDDEN PICTURE"],["train","TRAIN"],["sky","NIGHT SKY"],["balloon","BALLOON"]];
const defP = (name) => ({name, goal:1000, small:25, big:100, count:0, done:false});
function fresh(){ return {phase:"setup", players:1, mode:"team", dir:"up", goalName:"", game:"dots",
  p:[defP("PLAYER 1"), defP("PLAYER 2")], winner:null}; }
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); }
if (!S.p || S.p.length < 2) S = fresh();
S.kids = !!S.kids; PRESETS = S.kids ? PRESETS_KIDS : PRESETS_ADULT;
S.p.forEach(p=>{ if(!PRESETS[p.goal]){ const ks=Object.keys(PRESETS).map(Number); p.goal=ks.reduce((a,b)=>Math.abs(b-p.goal)<Math.abs(a-p.goal)?b:a); } [p.small,p.big]=PRESETS[p.goal]; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ================= AUDIO (all synthesized) =================
   A master bus with a compressor so stings are loud and punchy on a TV without clipping.
   Press = small blip. Small milestone = short sting. Big milestone = bigger sting. Finish = full fanfare.
   Each player has their own key and timbre so you can hear whose milestone it was. */
let AC = null, BUS = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    BUS = AC.createGain(); BUS.gain.value = 1.6; BUS.connect(comp).connect(AC.destination);
  }catch(e){} }
  if(AC && AC.state === "suspended") AC.resume();
  return AC;
}
const VOICE = [ {wave:"square", base:523.25, chord:[0,4,7]},      // P1: bright, C major
                {wave:"sawtooth", base:349.23, chord:[0,4,7]} ];  // P2: buzzier, F major, lower
const semi = (base, n) => base * Math.pow(2, n/12);
function tone(freq, t0, dur, wave, vol, opts){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(); let out = g;
  o.type = wave; o.frequency.setValueAtTime(freq, t0);
  if(opts && opts.slideTo) o.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  if(opts && opts.lp){ const f = a.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 6;
    f.frequency.setValueAtTime(opts.lp[0], t0); f.frequency.exponentialRampToValueAtTime(opts.lp[1], t0 + dur*0.6); g.connect(f); out = f; }
  out.connect(BUS); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(t0, dur, vol, type, freq){
  const a = ac(); if(!a) return;
  const b = a.createBuffer(1, Math.max(1, a.sampleRate*dur|0), a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = type || "highpass"; f.frequency.value = freq || 5000;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(BUS); s.start(t0);
}
// Mark 2026-10-09: "beep beep boop boop level noises are fine, they just need to be louder" — the original simple
// sounds, roughly 3x louder, through the compressor bus (loud without distorting).
function sndPress(pi){ const a=ac(); if(!a) return; const v=VOICE[pi]; tone(semi(v.base,12), a.currentTime, 0.08, v.wave, 0.18); }
function sndSmall(pi){ const a=ac(); if(!a) return; const v=VOICE[pi], t=a.currentTime;
  [0,4,7,12].forEach((n,i)=>tone(semi(v.base,n+12), t+i*0.07, 0.16, v.wave, 0.3)); }
function sndBig(pi){ const a=ac(); if(!a) return; const v=VOICE[pi], t=a.currentTime;
  const seq=[0,4,7,12,7,12,16,19,24];
  seq.forEach((n,i)=>tone(semi(v.base,n), t+i*0.11, 0.24, v.wave, 0.32));
  seq.forEach((n,i)=>tone(semi(v.base,n-12), t+i*0.11, 0.24, "triangle", 0.25));
  noise(t+seq.length*0.11, 0.4, 0.35, "highpass", 3000); }
function sndFinish(){ const a=ac(); if(!a) return; const t=a.currentTime; const B=392;
  const mel=[[0,.18],[4,.18],[7,.18],[12,.36],[7,.18],[12,.54],[14,.18],[16,.18],[19,.18],[24,.72],[19,.18],[24,.18],[28,.18],[31,1.2]];
  let x=t; mel.forEach(([n,d])=>{ tone(semi(B,n),x,d*.95,"square",.32); tone(semi(B,n-12),x,d*.95,"triangle",.26); x+=d; });
  [0,0.6,1.2,1.9,2.6,3.2,3.6].forEach(o=>noise(t+o,0.45,0.38,"highpass",3000));
  [[0,7,12],[5,9,12],[7,11,14],[12,16,19]].forEach((ch,i)=>ch.forEach(n=>tone(semi(B/2,n), t+i*1.0, 0.95, "sawtooth", 0.1))); }
// iPad/iPhone: audio only unlocks inside a touch gesture, so wake it on the first touch anywhere
addEventListener("touchend", function unlock(){ const a=ac(); if(a){ const b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); } removeEventListener("touchend", unlock); }, {passive:true});

/* ================= CONFETTI ================= */
const fx = document.getElementById("fx"), cx = fx.getContext("2d"); let parts = [], fxOn = false;
function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; } addEventListener("resize", sizeFx); sizeFx();
const CONF = ["#ff8a1f","#c070ff","#ffd23f","#ff3b3b","#ff5fa8","#fff6e8"];
function confetti(n, x, y, spread){
  for(let i=0;i<n;i++) parts.push({x:x??Math.random()*fx.width, y:y??-10, vx:(Math.random()-.5)*(spread||8), vy:Math.random()*-6-(y==null?-2:4),
    s:4+Math.random()*7, c:CONF[(Math.random()*CONF.length)|0], r:Math.random()*6, vr:(Math.random()-.5)*.3, life:1});
  if(!fxOn){ fxOn = true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.vy+=0.18; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>fx.height+20) p.life=0;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
  parts = parts.filter(p=>p.life>0);
  if(parts.length) requestAnimationFrame(tick); else { fxOn=false; cx.clearRect(0,0,fx.width,fx.height); }
}

/* ================= GAMES (progress -> picture) =================
   Each game gets (p 0..1, n presses, col css colour, done) and returns HTML for a <div class="art">. */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function order(n, seed){ const r=rng(seed), a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=(r()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const C = (s,c) => `<span style="color:${c}">${s}</span>`;
const DIM = "#4a3a5c", Y="#ffd23f", R="#ff3b3b", W="#fff6e8", PK="#ff5fa8", OR="#ff8a1f", PU="#c070ff", BR="#b0703a";
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const GAME = {
  dots(p,n,col){ const W_=22, rows=3, N=W_*rows, eaten=Math.min(N,Math.floor(p*N)); let out=[];
    for(let r=0;r<rows;r++){ let line="";
      for(let c=0;c<W_;c++){ const i = r%2===0 ? r*W_+c : r*W_+(W_-1-c);
        if(i===eaten && eaten<N){ const open=n%2===0; line += C(r%2===0?(open?"&gt;":"="):(open?"&lt;":"="), col); }
        else if(i<eaten) line+=" "; else line+=C("·",Y); }
      out.push(line); }
    if(eaten>=N) out.push(C("  BURP! ALL GONE!  ",Y));
    return out.join("\n"); },
  flower(p,n,col,done){ const H=9, stem=Math.round(p*H); let L=[];
    const head = done ? [" \\ | / ","- (@) -"," / | \\ "] : p>.8 ? ["       ","  (o)  ","   |   "] : p>.55 ? ["       ","   o   ","   |   "] : ["","",""];
    for(let r=H;r>=1;r--){ let s;
      if(r>stem) s="       ";
      else if(r===stem && !done && p<=.55) s="   ,   ";
      else s = (r%3===0) ? " ~-|   " : (r%3===1 && r>1) ? "   |-~ " : "   |   ";
      L.push(s); }
    let top = head[0]?head.map(h=>C(esc(h), done?PK:Y)):[];
    const body = L.map(s=>C(esc(s), done?OR:col));
    return (top.length?top.join("\n")+"\n":"") + body.join("\n") + "\n" + C("▀▀▀▀▀▀▀",BR); },
  clear(p,n,col,done){ const Wd=12,Hd=6,N=Wd*Hd, gone=Math.floor(p*N), ord=order(N,7), dead=new Set(ord.slice(0,gone)); let out=[];
    for(let r=0;r<Hd;r++){ let line=""; for(let c=0;c<Wd;c++){ const i=r*Wd+c; line += dead.has(i) ? "  " : C("██", (r+c)%2?col:Y); } out.push(line); }
    if(done) out.push(C("  SPARKLING!  ",Y)); return out.join("\n"); },
  race(p,n,col,done){ const T=20, pos=Math.min(T-1,Math.floor(p*(T-1))); let lane="";
    for(let i=0;i<T;i++) lane += i===pos ? C(n%2?"o=o&gt;":"o=o&gt;",col).replace("o=o","o=o") : C(i%2?"-":" ",DIM);
    const flag = done ? C("▓▓",Y) : C("▒▒",W);
    return C("START",DIM)+" ".repeat(T-6)+C("FINISH",DIM)+"\n"+ C("════════════════════════════",DIM).slice(0,0) +
      C("=".repeat(T+6),DIM)+"\n"+lane+" "+flag+"\n"+C("=".repeat(T+6),DIM); },
  bubble(p,n,col,done){ const Wd=12,Hd=5,N=Wd*Hd, popped=Math.floor(p*N), ord=order(N,11); const at=new Map(ord.map((v,i)=>[v,i])); let out=[];
    for(let r=0;r<Hd;r++){ let line=""; for(let c=0;c<Wd;c++){ const i=at.get(r*Wd+c);
      line += i<popped ? (i===popped-1 ? C("* ",Y) : C("· ",DIM)) : C("O ",col); } out.push(line); }
    if(done) out.push(C(" ALL POPPED! ",Y)); return out.join("\n"); },
  tower(p,n,col,done){ const H=10, h=Math.floor(p*H); let out=[];
    out.push(done ? C("  |>  ",R) : "      ");
    out.push(done ? C("  |   ",W) : "      ");
    for(let r=H;r>=1;r--) out.push(r<=h ? C("[####]", r%2?col:Y) : C("  ..  ",DIM));
    out.push(C("▀▀▀▀▀▀",BR)); return out.join("\n"); },
  mountain(p,n,col,done){ const H=8, steps=H*2, s=Math.floor(p*steps); const fr=Math.floor(s/2); let out=[];
    for(let r=0;r<H;r++){ const lvl=H-1-r; let pad=" ".repeat(H-1-lvl); let line;
      const here = (fr===lvl && !done);
      line = " ".repeat(lvl*2) + C("/",DIM) + (here ? C(n%2?"o":"o",col) : " ") + C("\\".padStart(1),"transparent");
      out.push(line); }
    out = [];
    for(let r=0;r<H;r++){ const lvl=H-1-r; let line="";
      for(let c=0;c<H*2+2;c++){
        if(lvl===H-1 && c===H*2-2 && done){ line+=C("P",R); continue; }
        if(c===lvl*2 && lvl===fr && !done){ line+=C("Y",col); continue; }
        if(c===lvl*2+1) line+=C("/", lvl<=fr?col:DIM); else if(c>lvl*2+1) line+=C(":",DIM); else line+=" "; }
      out.push(line); }
    if(done) out.unshift(" ".repeat(H*2-3)+C("TOP!",Y));
    return out.join("\n"); },
  jar(p,n,col,done){ const H=8, Wd=8, N=H*Wd, filled=Math.floor(p*N); let out=[C(done?" _[====]_ ":"  [____]  ", done?Y:DIM)];
    for(let r=H-1;r>=0;r--){ let line=C("|",W); for(let c=0;c<Wd;c++){ const i=r*Wd+c; line += i<filled ? C("o",[col,Y,PK,R][(i*7)%4]) : " "; } out.push(line+C("|",W)); }
    out.push(C("'--------'",W)); return out.join("\n"); },
  rocket(p,n,col,done){ const fuel=Math.floor(p*10); let gauge=[]; for(let i=10;i>=1;i--) gauge.push(i<=fuel?C("█",i>7?R:i>4?OR:Y):C("░",DIM));
    const rk = ["  /\\  "," |  | "," |()| "," |  | ","/|  |\\","  ''  "];
    let lines=[]; const lift = done ? 3 : 0;
    for(let i=0;i<lift;i++) lines.push("      ");
    rk.forEach(s=>lines.push(C(esc(s), col)));
    if(done) lines.push(C("  ^^  ",OR), C(" ^^^^ ",R), C("LIFTOFF",Y)); else lines.push(C("======",DIM));
    while(lines.length<11) lines.unshift("      ");
    return lines.slice(-11).map((l,i)=>l+"   "+(gauge[i]||" ")).join("\n"); },
  picture(p,n,col,done){
    const art = [ // an original little scene: sun, house, flowers
      "......YY........",
      ".....YYYY.......",
      "......YY...RRR..",
      "..........RRRRR.",
      ".........RRRRRRR",
      "..........WWWWW.",
      "..........WPWOW.",
      "..........WWKWW.",
      ".PK.OK....WWKWW.",
      ".KK.KK.PK.......",
      "BBBBBBBBBBBBBBBB"];
    const map={Y:Y,R:R,W:W,P:PU,O:OR,K:PK,B:BR,".":"#1a1028"};
    const Hh=art.length, Ww=art[0].length, N=Hh*Ww, shown=Math.floor(p*N), ord=order(N,3), vis=new Set(ord.slice(0,shown)); let out=[];
    for(let r=0;r<Hh;r++){ let line=""; for(let c=0;c<Ww;c++){ const i=r*Ww+c, ch=art[r][c];
      line += vis.has(i) ? C("██", map[ch]) : C("▒▒", DIM); } out.push(line); }
    return out.join("\n"); },
  train(p,n,col,done){ const maxC=6, cars=Math.floor(p*maxC), shift=done?6:0; let top="",mid="",bot="";
    const eng=[" _||__ ","|  __ |","oo----o"], car=[" ____ ","|[][]|","-o--o-"];
    for(let i=0;i<cars;i++){ top=car[0]+top; mid=car[1]+mid; bot=car[2]+bot; }
    top=top+eng[0]; mid=mid+eng[1]; bot=bot+eng[2];
    const pad=" ".repeat(shift); const smoke = done ? C(pad+" ".repeat(cars*6)+"  ° o O CHOO!",W) : (cars?C(" ".repeat(cars*6)+"  °",DIM):"");
    return smoke+"\n"+C(esc(pad+top),col)+"\n"+C(esc(pad+mid),col)+"\n"+C(esc(pad+bot),Y)+"\n"+C("#".repeat(Math.max(14,cars*6+7+shift)),DIM); },
  sky(p,n,col,done){ const Wd=26,Hd=8, N=34, lit=Math.floor(p*N), r=rng(5); const pos=[]; const used=new Set();
    while(pos.length<N){ const x=(r()*Wd)|0, y=(r()*Hd)|0, k=y*Wd+x; if(!used.has(k)){ used.add(k); pos.push(k);} }
    const idx=new Map(pos.map((k,i)=>[k,i])); let out=[];
    for(let y=0;y<Hd;y++){ let line=""; for(let x=0;x<Wd;x++){ const k=y*Wd+x;
      if(idx.has(k)){ const i=idx.get(k); line += i<lit ? C(done?"✦":"*", done?Y:(i%3?Y:col)) : C("·",DIM); } else line+=" "; } out.push(line); }
    if(done) out.push(C("  THE SKY IS FULL!",Y)); else out.push(C("  ".padEnd(3)+"     "+"🌙".slice(0,0),DIM));
    return out.join("\n"); },
  balloon(p,n,col,done){
    if(done) return C(esc("  \\  |  /  \n -- POP! --\n  /  |  \\  \n"),Y)+C(esc("     |\n     |\n    _|_"),W);
    const sz=Math.min(4,Math.floor(Math.sqrt(p)*5)); const B=[
      ["  o  "],
      [" (_) "],
      ["  _  "," ( ) ","  v  "],
      ["  ___  "," (   ) "," (   ) ","  \\_/  "],
      ["  _____  "," /     \\ ","|       |"," \\     / ","  \\___/  "]];
    const body=B[sz]; const w=body[0].length;
    const lines = body.map(s=>C(esc(s),col)); const pad=" ".repeat(Math.max(0,(9-w)/2|0));
    return [...lines.map(l=>pad+l), pad+" ".repeat(w/2|0)+C("|",W), pad+" ".repeat(w/2|0)+C("|",W), C("    _|_",W)].join("\n"); }
};

/* ================= ANIMATED GAMES (canvas, chunky low-res pixel art scaled up) =================
   Built 2026-10-09 on Mark's "make them". Each stage draws from progress (so it is right after a reload)
   and adds live effects on every press; milestone tiers: 0 press, 1 small, 2 big, 3 finish. All art original. */
const ANIMS = [["invaders","DUST BUNNY INVADERS"],["window","DIRTY WINDOW"],["fireworks","FIREWORKS SHOW"],["skyline","NIGHT SKYLINE"],
  ["aquarium","AQUARIUM"],["plinko","PLINKO BOARD"],["garden","GARDEN PLOT"],["volcano","VOLCANO"],["dominoes","DOMINO RUN"],
  ["popcorn","POPCORN"],["dig","DIG TO TREASURE"],["tug","TUG OF WAR · 2P"],["laps","LAP RACE · 2P"]];
const SHARED = new Set(["tug","laps"]);
const isAnim = k => ANIMS.some(a=>a[0]===k);
let STAGES = [], rafOn = false;
function makeStage(canvas, kind, o){ const g = {cv:canvas, cx:canvas.getContext("2d"), kind, W:192, H:96, p:0, n:0, goal:1, done:false, doneAt:0,
  col:o.col, pi:o.pi, ps:[0,0], dn:[false,false], parts:[], fx:[], t:performance.now()/1000, mem:{}}; sizeStage(g); return g; }
function sizeStage(g){ const r = g.cv.getBoundingClientRect(); const W = 192, H = Math.max(56, Math.min(150, Math.round(W*(r.height||96)/(r.width||192))));
  g.W = W; g.H = H; g.cv.width = W; g.cv.height = H; g.cx.imageSmoothingEnabled = false; g.mem = {}; }
addEventListener("resize", ()=>STAGES.forEach(sizeStage));
function loop(ts){
  if(!STAGES.length || S.phase === "setup"){ rafOn = false; return; }
  const t = ts/1000;
  for(const g of STAGES){ g.t = t; if(g.done && !g.doneAt) g.doneAt = t; if(!g.done) g.doneAt = 0;
    g.cx.setTransform(1,0,0,1,0,0); g.cx.clearRect(0,0,g.W,g.H);
    try{ AN[g.kind].draw(g); }catch(e){ console.error(g.kind, e); }
    g.cx.setTransform(1,0,0,1,0,0); stepParts(g); }
  requestAnimationFrame(loop);
}
function startLoop(){ if(!rafOn){ rafOn = true; requestAnimationFrame(loop); } }
function stageEvent(g, tier, pi){ try{ AN[g.kind].event && AN[g.kind].event(g, tier, pi); }catch(e){ console.error(g.kind, e); } }
/* helpers */
const PAL = {Y:"#ffd23f", R:"#ff3b3b", O:"#ff8a1f", P:"#dc9bff", K:"#ff5fa8", W:"#fff6e8", D:"#07040c"};
const FIRE = [PAL.Y,PAL.R,PAL.O,PAL.P,PAL.K,PAL.W];
function box(g,x,y,w,h,c){ g.cx.fillStyle=c; g.cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function spr(g, rows, x, y, pal, flip, sc){ sc=sc||1; const c=g.cx; for(let r=0;r<rows.length;r++){ const row=rows[r]; for(let k=0;k<row.length;k++){ const ch=row[flip?row.length-1-k:k]; if(ch==="."||ch===" ") continue; c.fillStyle=pal[ch]||PAL[ch]||"#fff"; c.fillRect(Math.round(x)+k*sc, Math.round(y)+r*sc, sc, sc); } } }
function disc(g,x,y,r,c){ g.cx.fillStyle=c; g.cx.beginPath(); g.cx.arc(x,y,r,0,Math.PI*2); g.cx.fill(); }
function burst(g,x,y,n,cols,sp,grav,life){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(Math.random()*.7+.3)*(sp||1.4);
  g.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(grav?0.6:0),life:(life||36)*(0.6+Math.random()*.6),c:cols[(Math.random()*cols.length)|0],gr:grav||0,s:1}); } }
function stepParts(g){ const c=g.cx; g.parts=g.parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.gr; p.life--; if(p.life<=0||p.y>g.H+4) return false; c.fillStyle=p.c; c.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s); return true; });
  if(g.parts.length>900) g.parts.splice(0, g.parts.length-900); }
function label(g, s, y, col){ const c=g.cx; c.font='8px "Press Start 2P", monospace'; c.textAlign="center"; c.textBaseline="middle";
  const w=c.measureText(s).width; c.fillStyle="rgba(7,4,12,.78)"; c.fillRect(Math.round(g.W/2-w/2-3), Math.round(y-6), Math.ceil(w+6), 12);
  c.fillStyle=PAL.R; c.fillText(s, g.W/2+1, y+1); c.fillStyle=col||PAL.Y; c.fillText(s, g.W/2, y); }
const winName = w => ((S.p[w] && S.p[w].name) || (w===0?"ORANGE":"PURPLE")).toUpperCase().slice(0,12);
const units = (g,N) => Math.min(N, Math.floor(g.p*N));
const prevUnits = (g,N) => Math.min(N, Math.floor(Math.max(0,g.n-1)/Math.max(1,g.goal)*N));
function finale(g, rate){ if(!g.mem.fin || g.t>g.mem.fin){ g.mem.fin=g.t+(rate||0.28); burst(g, 16+Math.random()*(g.W-32), 8+Math.random()*(g.H*.5), 22, FIRE, 1.5, 0.02, 44); } }
const SCENE = ["......YY........",".....YYYY.......","......YY...RRR..","..........RRRRR.",".........RRRRRRR","..........WWWWW.","..........WPWOW.","..........WWKWW.",".PK.OK....WWKWW.",".KK.KK.PK.......","BBBBBBBBBBBBBBBB"];
const SCENE_PAL = {Y:PAL.Y,R:PAL.R,W:PAL.W,P:PAL.P,O:PAL.O,K:PAL.K,B:"#b0703a"};
const BUNNY = [["..g..g..",".gg..gg.","gggggggg","gkggggkg","ggggpggg",".g.gg.g."],["..g..g..",".gg..gg.","gggggggg","gkggggkg","ggggpggg","g.g..g.g"]];
const BOTTLE = ["..ww...",".ccc...",".cwwww.",".ccc...","ccccc..","ccYcc..","ccccc..","ccccc.."];
const FISH = [".cc..","ccccc","kcc.c",".cc.."];
const PERSON = [[".h.","hhh",".b.","bbb","b.b"],[".h.","hhh","bb.",".bb","b.b"]];
const AN = {
/* 1 — Dust Bunny Invaders: a formation drifts down; every press fires; bunnies go poof */
invaders:{
  draw(g){ const cols=8, rows=5, N=cols*rows, k=units(g,N); const ord=g.mem.ord||(g.mem.ord=order(N,21)); const pend=g.mem.pend||(g.mem.pend={}), hit=g.mem.hit||(g.mem.hit={});
    const dead=new Set(ord.slice(0,k)); const sway=Math.sin(g.t*1.3)*10, base=6+Math.floor(g.p*(g.H*0.3)), cw=Math.floor((g.W-30)/cols);
    g.mem.pos = i => [15+(i%cols)*cw+cw/2-4+sway, base+Math.floor(i/cols)*9];
    for(let i=0;i<N;i++){ if(dead.has(i) && !(pend[i]>g.t)) continue; const [x,y]=g.mem.pos(i);
      spr(g, BUNNY[((g.t*2.5)|0+i)%2], x, y, {g:hit[i]>g.t?"#ffffff":"#bfb3cc", k:PAL.D, p:PAL.K}); }
    const next = ord[Math.min(k,N-1)], tx = g.mem.pos(next)[0]; g.mem.cx = g.mem.cx==null ? tx : g.mem.cx+(tx-g.mem.cx)*0.25;
    box(g,0,g.H-2,g.W,2,"#2c1d3d"); spr(g, BOTTLE, g.mem.cx, g.H-10, {c:g.col, w:PAL.W});
    g.fx = g.fx.filter(s=>{ s.y-=3; box(g,s.x,s.y,1,3,PAL.Y); if(s.y<=s.ty){ burst(g,s.x,s.ty, s.kill?18:5, s.kill?["#bfb3cc",PAL.W,PAL.K]:["#bfb3cc"], s.kill?1.4:.6, .03, s.kill?32:14); return false; } return true; });
    if(g.done){ finale(g); label(g,"SPOTLESS!", g.H/2); } },
  event(g,tier){ if(!g.mem.pos) return; const N=40, k=units(g,N), kill=k>prevUnits(g,N), ord=g.mem.ord;
    const target = kill ? ord[k-1] : ord[Math.min(k,N-1)]; const [x,y]=g.mem.pos(target);
    g.fx.push({x:(g.mem.cx||x)+3, y:g.H-11, ty:y+3, kill});
    if(kill) g.mem.pend[target]=g.t+(g.H-11-y)/180; else g.mem.hit[target]=g.t+0.1;
    if(tier>=2) for(let j=0;j<6;j++) setTimeout(()=>burst(g,Math.random()*g.W,Math.random()*g.H*.6,14,FIRE,1.3,.02,40), j*110); } },
/* 2 — Dirty Window: grime over a picture, cleared in squeegee strokes */
window:{
  draw(g){ const s=Math.max(1,Math.floor(Math.min(g.W/16,(g.H-2)/11))), ox=Math.floor((g.W-16*s)/2), oy=g.H-11*s;
    box(g,0,0,g.W,g.H,"#1a0d2c"); box(g,0,g.H-s,g.W,s,"#b0703a");
    for(let r=0;r<11;r++) for(let c=0;c<16;c++){ const ch=SCENE[r][c]; if(ch!==".") box(g,ox+c*s,oy+r*s,s,s,SCENE_PAL[ch]); }
    const cw=6, chh=6, cols=Math.ceil(g.W/cw), rows=Math.ceil(g.H/chh), N=cols*rows, k=units(g,N); g.mem.N=N; g.mem.cols=cols;
    const GR=["#5a4a3a","#4e4032","#66553f","#574634","#4a3d30","#6b5a44"];
    for(let i=k;i<N;i++){ const r=Math.floor(i/cols), c=r%2?cols-1-(i%cols):i%cols; box(g,c*cw,r*chh,cw,chh,GR[(r*31+c*17)%6]); }
    if(k<N){ const r=Math.floor(k/cols), c=r%2?cols-1-(k%cols):k%cols; const hot=g.fx.length>0; box(g,c*cw+(r%2?cw:-1),r*chh-1,1,chh+2,hot?PAL.W:"#9a8a7a"); }
    g.fx=g.fx.filter(f=>--f.life>0);

      else { const wet=g.mem.wet[i]>g.t; box(g,x,y,5,4,wet?"#7a7488":"#120c1c"); box(g,x+2,y,1,4,"#2a2040"); box(g,x,y+3,5,1,"#241a34"); } }
    // smoke drifting from whatever is still burning
    if(left>0 && Math.random()<0.2+0.5*left/N){ const [x,y]=pos(byRank[k+Math.floor(Math.random()*left)]);
      g.parts.push({x:x+2, y:y-3, vx:(Math.random()-0.3)*0.25, vy:-0.25-Math.random()*0.3, gr:0, life:45+Math.random()*30|0, c:Math.random()<.5?"#4a4058":"#625874", s:2}); }
    // fire engine
    const tx=bx+bw+14, ty=g.H-11;
    box(g,tx,ty,32,6,PAL.R); box(g,tx+24,ty-5,8,5,PAL.R); box(g,tx+26,ty-4,4,2,"#ffe8d0"); box(g,tx,ty+3,32,1,PAL.W);
    const sir=Math.sin(g.t*(g.done?6:10))>0; box(g,tx+24,ty-6,3,1,sir?PAL.Y:PAL.W); box(g,tx+28,ty-6,3,1,sir?PAL.W:PAL.Y);
    disc(g,tx+7,g.H-4,2.5,"#1a1420"); disc(g,tx+25,g.H-4,2.5,"#1a1420"); box(g,0,g.H-3,g.W,3,"#2a2036");
    // ladder: swings up to the lowest window still burning, then to the roof
    const aim = k<N ? pos(byRank[k]) : null, tipY = aim ? aim[1]+3 : by-1, tipX = aim ? bx+bw+2 : bx+bw-1;
    g.mem.ly = g.mem.ly==null ? ty-6 : g.mem.ly + (tipY-g.mem.ly)*0.12;
    const px=tx+6, py=ty-1, ex=tipX, ey=g.mem.ly, len=Math.hypot(ex-px,ey-py), ux=(ex-px)/len, uy=(ey-py)/len, nx=-uy, ny=ux;
    for(let s=0;s<=len;s++){ box(g,px+ux*s,py+uy*s,1,1,"#c8c4d4"); box(g,px+ux*s+nx*3,py+uy*s+ny*3,1,1,"#c8c4d4");
      if(s%3===0) for(let q=1;q<3;q++) box(g,px+ux*s+nx*q,py+uy*s+ny*q,1,1,"#8a8498"); }
    box(g,px-1,py-1,4,3,"#8a8498");
    // firefighter on the ladder (player colour), hose aimed at the window
    const fx=ex+1, fy=ey-6; spr(g,FIREMAN,fx,fy,{h:PAL.Y,f:"#ffd8b0",b:g.col});
    if(aim && g.mem.spray>g.t){ const wx=aim[0]+2, wy=aim[1]+1, sx=fx, sy=fy+2;
      for(let s=0;s<=1;s+=0.04){ const x=sx+(wx-sx)*s, y=sy+(wy-sy)*s-Math.sin(s*Math.PI)*5, ph=((s*25-g.t*30)%3+3)%3;
        box(g,x,y,1,1,WATER[ph|0]); if(ph<1) box(g,x,y+1,1,1,WATER[2]); } }
    if(g.done){ if(Math.random()<.6){ const d=Math.random()<.5?-1:1; g.parts.push({x:tx+6, y:ty-2, vx:d*(0.6+Math.random()*0.5), vy:-2-Math.random()*0.5, gr:0.06, life:70, c:WATER[(Math.random()*3)|0], s:1}); }
      finale(g,0.6); label(g,"FIRE'S OUT!",8); } },
  event(g,tier){ const G=g.mem.geo; if(!G) return; g.mem.spray=g.t+(tier?0.9:0.35);
    const k=units(g,G.N), k0=prevUnits(g,G.N); if(!g.mem.wet) g.mem.wet={};
    for(let r=k0;r<k;r++){ const i=G.byRank[r], [x,y]=G.pos(i); g.mem.wet[i]=g.t+1.4;
      burst(g,x+2,y, tier?16:8, ["#d8d0e0","#9a90a8",PAL.W], tier?0.9:0.6, -0.02, 32); }
    if(tier>=1 && k<G.N){ const [x,y]=G.pos(G.byRank[Math.min(k,G.N-1)]); burst(g,x+2,y+1, tier===2?30:14, WATER, tier===2?1.6:1, 0.04, 30); }
    if(tier===2){ const row=Math.floor(G.byRank[Math.max(0,k-1)]/G.cols); for(let c=0;c<G.cols;c++){ const [x,y]=G.pos(row*G.cols+c); burst(g,x+2,y+1,6,WATER,0.8,0.05,26); } } } };

function launch(g,big){ const cs=[[PAL.R,PAL.O,PAL.Y],[PAL.P,PAL.K,PAL.W],[PAL.Y,PAL.W,PAL.O],[PAL.K,PAL.R,PAL.Y],[PAL.P,PAL.W,PAL.Y]][(Math.random()*5)|0];
  g.fx.push({x:20+Math.random()*(g.W-40), y:g.H-8, vy:-(2.0+Math.random()*1.0)*Math.sqrt(g.H/96), cols:cs, big}); }
function drop(g,col){ const path=[0]; for(let r=0;r<7;r++) path.push(path[r]+(Math.random()<.5?0:1)); g.fx.push({t0:g.t, path, bin:path[7], c:col}); }

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const nP = () => S.players === 1 ? 1 : 2;
const team = () => S.players === 2 && S.mode === "team";
function goalOf(i){ return team() ? S.p[0].goal : S.p[i].goal; }
function msOf(i){ return team() ? [S.p[0].small, S.p[0].big] : [S.p[i].small, S.p[i].big]; }
const total = () => S.p[0].count + (nP()===2 ? S.p[1].count : 0);
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }

/* ================= SETUP SCREEN ================= */
function goalBlock(i, label){
  const g = S.p[i];
  const presets = Object.keys(PRESETS).map(v=>`<button class="opt${+v===g.goal?" sel":""}" data-goal="${v}" data-pi="${i}">${v}</button>`).join("");
  const [sm,bg] = PRESETS[g.goal];
  return `<div class="lab">${label}</div><div class="opts">${presets}</div>
    <div class="mshint">SMALL CHEER EVERY ${sm} · BIG CHEER EVERY ${bg}</div>`;
}
function setKids(on){
  const from = Object.keys(PRESETS).map(Number), to = Object.keys(on ? PRESETS_KIDS : PRESETS_ADULT).map(Number);
  S.kids = on; PRESETS = on ? PRESETS_KIDS : PRESETS_ADULT;
  // same slot in the other list: 100→25, 250→50, 500→75, 750→100, 1000→150 (and back)
  S.p.forEach(p=>{ const k = from.indexOf(p.goal); p.goal = to[k < 0 ? to.length-1 : k]; [p.small,p.big] = PRESETS[p.goal]; });
  save(); drawSetup();
}
function drawSetup(){
  const kb = $("#kids"); kb.classList.toggle("on", S.kids); kb.setAttribute("aria-pressed", S.kids ? "true" : "false");
  kb.textContent = S.kids ? "KIDS MODE · ON" : "KIDS MODE";
  document.querySelectorAll("#setup .opts[data-k]").forEach(box=>{
    const k=box.dataset.k; box.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel", String(S[k])===b.dataset.v)); });
  $("#moderow").style.display = S.players===2 ? "" : "none";
  const shOK = S.players===2 && S.mode!=="team";
  document.querySelectorAll("#gamepick2 .shared").forEach(b=>b.style.display = shOK ? "" : "none");
  if(SHARED.has(S.game) && !shOK){ S.game="dots"; save(); document.querySelectorAll("#setup .opts[data-k=game] .opt").forEach(b=>b.classList.toggle("sel", b.dataset.v===S.game)); }
  $("#goalName").value = S.goalName || "";
  let html = "";
  const cards = S.players===1 ? [0] : [0,1];
  cards.forEach(i=>{
    html += `<div class="pcard p${i+1}"><h3>PLAYER ${i+1}</h3>
      <div class="lab">NAME</div><input type="text" maxlength="12" data-f="name" data-pi="${i}" value="${esc(S.p[i].name)}">
      <div style="height:14px"></div>
      ${ (team() && i===1) ? `<div class="lab">GOAL</div><div style="font-size:10px;color:var(--dim);line-height:1.8">SHARED TEAM GOAL · SET ON PLAYER 1</div>` : goalBlock(i, team() ? "TEAM GOAL (BOTH OF YOU TOGETHER)" : "GOAL") }
    </div>`; });
  $("#pcards").innerHTML = html;
  $("#keyhint").innerHTML = S.players===1
    ? "SPACE BAR = +1 · OR TAP THE SCREEN ON THE IPAD"
    : `Z = ${esc(S.p[0].name)} · M = ${esc(S.p[1].name)} · OR TAP YOUR OWN HALF ON THE IPAD`;
}
$("#gamepick").innerHTML = GAMES.map(([v,l])=>`<button class="opt" data-v="${v}">${l}</button>`).join("");
$("#gamepick2").innerHTML = ANIMS.map(([v,l])=>`<button class="opt${SHARED.has(v)?" shared":""}" data-v="${v}">${l}</button>`).join("");
document.querySelectorAll("#setup .opts[data-k]").forEach(box=>box.addEventListener("click", e=>{
  const b=e.target.closest(".opt"); if(!b) return; const k=box.dataset.k;
  S[k] = (k==="players") ? +b.dataset.v : b.dataset.v;
  if(k==="mode" && S.mode==="race" && S.game==="dots") S.game="race";
  save(); drawSetup(); }));
$("#pcards").addEventListener("click", e=>{
  const b=e.target.closest("[data-goal]"); if(!b) return; const i=+b.dataset.pi, v=+b.dataset.goal;
  S.p[i].goal=v; [S.p[i].small,S.p[i].big]=PRESETS[v]; save(); drawSetup(); });
$("#pcards").addEventListener("input", e=>{
  const el=e.target; if(!el.dataset.f) return; const i=+el.dataset.pi, f=el.dataset.f;
  if(f==="name") S.p[i].name = el.value.toUpperCase().slice(0,12) || `PLAYER ${i+1}`;
  else { const v=Math.max(1, parseInt(el.value,10)||1); S.p[i][f]=v; }
  save();
  if(f==="name") $("#keyhint").innerHTML = S.players===1 ? "SPACE BAR = +1 · OR TAP THE SCREEN ON THE IPAD" : `Z = ${esc(S.p[0].name)} · M = ${esc(S.p[1].name)} · OR TAP YOUR OWN HALF ON THE IPAD`;
  if(f==="goal") document.querySelectorAll(`[data-goal][data-pi="${i}"]`).forEach(b=>b.classList.toggle("sel", +b.dataset.goal===S.p[i].goal));
});
$("#goalName").addEventListener("input", e=>{ S.goalName = e.target.value.toUpperCase().slice(0,24); save(); });
$("#kids").addEventListener("click", e=>{ e.stopPropagation(); setKids(!S.kids); });
$("#start").addEventListener("click", startGame);
function startGame(){
  ac();   // unlock audio on this gesture
  S.p.forEach(p=>{ p.count=0; p.done=false; }); S.winner=null; S.phase="play"; save(); buildPlay(); show("play"); $("#msub").textContent = S.goalName ? `NOW CLEANING: ${S.goalName}` : "INSERT EFFORT TO CONTINUE";
}

/* ================= PLAY SCREEN ================= */
function buildPlay(){
  const sq = $("#squares"); sq.innerHTML = "";
  $("#play").classList.toggle("solo", nP()===1);
  for(let i=0;i<nP();i++){
    const d=document.createElement("div"); d.className=`sq p${i+1}`; d.dataset.pi=i;
    d.innerHTML = `<div class="won">FINISHED!</div><div class="who">${esc(S.p[i].name)}</div>
      <div class="goalname">${team()? "TEAM" : esc(S.goalName||"")}</div><div class="num">0</div><div class="of"></div>
      <div class="bar"><i></i></div><div class="art"></div>
      <div class="keycap">${nP()===1 ? "SPACE / TAP" : (i===0 ? "Z / TAP LEFT" : "M / TAP RIGHT")}</div>`;
    sq.appendChild(d);
  }
  const anim = isAnim(S.game), shared = anim && SHARED.has(S.game) && nP()===2 && !team();
  $("#play").classList.toggle("animated", anim); $("#play").classList.toggle("shared", shared);
  $("#teambar").classList.toggle("on", team() || shared);
  if(anim) document.querySelectorAll(".sq").forEach(el=>{ const d=document.createElement("div"); d.className="stage"; d.innerHTML="<canvas></canvas>"; el.insertBefore(d, el.querySelector(".keycap")); });
  STAGES = [];
  draw();
  if(anim) requestAnimationFrame(()=>{
    if(team() || shared) STAGES.push(Object.assign(makeStage($("#tstage canvas"), S.game, {col:PAL.O, pi:0}), {role:"top"}));
    else document.querySelectorAll(".sq").forEach(el=>{ const i=+el.dataset.pi; STAGES.push(Object.assign(makeStage(el.querySelector(".stage canvas"), S.game, {col:i===0?PAL.O:PAL.P, pi:i}), {role:"sq"})); });
    feedStages(); startLoop(); });
}
function feedStages(){
  const sh = SHARED.has(S.game);
  STAGES.forEach(g=>{
    if(g.role==="top"){
      if(team()){ const G=S.p[0].goal, tt=Math.min(total(),G); g.p=tt/G; g.n=tt; g.goal=G; g.done=tt>=G; }
      g.ps=[0,1].map(i=>Math.min(1,S.p[i].count/S.p[i].goal)); g.dn=[0,1].map(i=>S.p[i].count>=S.p[i].goal); g.winner=S.winner;
      if(sh){ g.done = g.dn[0]||g.dn[1]; }
    } else { const P=S.p[g.pi], G=P.goal, c=Math.min(P.count,G); g.p=c/G; g.n=c; g.goal=G; g.done=c>=G; }
  });
}
function draw(){
  const up = S.dir === "up";
  if(team()){
    const g=S.p[0].goal, t=Math.min(total(),g), pr=t/g;
    $("#tnum").textContent = up ? t : (g - t);
    $("#tsub").textContent = `${esc(S.goalName||"TEAM")} · ${up ? `${t} OF ${g}` : `${g-t} TO GO`}`;
    if(!isAnim(S.game)) $("#tart").innerHTML = GAME[S.game](pr, t, OR, t>=g);
  }
  document.querySelectorAll(".sq").forEach(el=>{
    const i=+el.dataset.pi, P=S.p[i], col = i===0 ? OR : PU;
    if(team()){
      el.querySelector(".num").textContent = P.count;
      el.querySelector(".of").textContent = "ITEMS DEALT WITH";
      el.querySelector(".bar").style.display = "none"; el.querySelector(".art").innerHTML = "";
    } else {
      const g=P.goal, c=Math.min(P.count,g), pr=c/g;
      el.querySelector(".num").textContent = up ? c : g - c;
      el.querySelector(".of").textContent = up ? `OF ${g}` : `TO GO · ${c} DONE`;
      el.querySelector(".bar i").style.width = (pr*100)+"%";
      if(!isAnim(S.game)) el.querySelector(".art").innerHTML = GAME[S.game](pr, c, col, c>=g);
      el.classList.toggle("done", P.done);
    }
  });
  feedStages();
}
function flash(el, cls, ms){ el.classList.remove("flash","big"); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms); }
function toast(txt, el, col){ const t=$("#toast"); t.textContent=txt;
  if(el && nP()===2){ const r=el.getBoundingClientRect(), pr=$("#play").getBoundingClientRect(); t.style.left=(r.left-pr.left)+"px"; t.style.width=r.width+"px"; t.style.color=col; }
  else { t.style.left="0"; t.style.width="100%"; t.style.color=""; }
  t.classList.remove("go"); void t.offsetWidth; t.classList.add("go"); }

function press(i){
  if(S.phase!=="play" || $("#finish").classList.contains("on")) return;
  if(i>=nP()) return;
  const P=S.p[i]; if(!team() && P.done) return;
  ac();
  P.count++;
  const el = document.querySelectorAll(".sq")[i];
  // which counter do milestones run on?
  const c = team() ? total() : P.count, g = goalOf(i), [sm,bg] = msOf(i);
  const tier = c >= g ? 3 : (c % bg === 0 ? 2 : (c % sm === 0 ? 1 : 0));
  if(c >= g){
    if(team()){ finishAll(); }
    else { P.done=true;
      if(S.mode==="race" && nP()===2){ S.winner=i; finishAll(); }
      else if(nP()===1 || S.p.every((q,k)=>k>=nP()||q.done)){ finishAll(); }
      else { sndBig(i); confetti(90, el.getBoundingClientRect().left+el.offsetWidth/2, innerHeight*.4, 14); toast(`${P.name} FINISHED!`, el, i===0?"#ffd08a":"#ecc8ff"); flash(el,"big",600); }
    }
  } else if(c % bg === 0){ sndBig(i); flash(el,"big",500); confetti(70, el.getBoundingClientRect().left+el.offsetWidth/2, innerHeight*.35, 12); toast(`${c}!`, el, i===0?"#ffd23f":"#ff5fa8"); }
  else if(c % sm === 0){ sndSmall(i); flash(el,"flash",220); confetti(14, el.getBoundingClientRect().left+el.offsetWidth/2, innerHeight*.3, 6); }
  else { sndPress(i); flash(el,"flash",120); }
  save(); draw();
  STAGES.forEach(st=>{ if(st.role==="top" || st.pi===i) stageEvent(st, tier, i); });
}

/* ================= FINISH ================= */
let ynSel = "yes";
let finT=0, finReadyAt=0, finOpenAt=0;
const finOn = () => $("#finish").classList.contains("on");
function finishAll(){
  S.phase="done"; save(); draw();
  sndFinish(); let k=0; const burst=()=>{ confetti(120); if(++k<7) setTimeout(burst, 550); }; burst();
  // let them see what they made before the menu comes up
  finReadyAt=performance.now()+2000; $("#msub").textContent="★ LOOK WHAT YOU DID! ★";
  clearTimeout(finT); finT=setTimeout(showFinish, 5500);
}
function viewScene(){ clearTimeout(finT); $("#finish").classList.remove("on"); finReadyAt=performance.now()+400; $("#msub").textContent="PRESS ANY KEY FOR THE MENU"; }
function showFinish(){
  clearTimeout(finT); finOpenAt=performance.now(); $("#msub").textContent = S.goalName ? `NOW CLEANING: ${S.goalName}` : "INSERT EFFORT TO CONTINUE";
  const items = total();
  $("#fgoal").textContent = S.goalName ? `— ${S.goalName} —` : "";
  $("#ftitle").textContent = (S.winner!=null) ? `${S.p[S.winner].name} WINS!` : "YOU DID IT!";
  $("#fline").innerHTML = `${items} ITEMS DEALT WITH!`;
  $("#fdetail").innerHTML = nP()===2
    ? `<b style="color:var(--p1)">${esc(S.p[0].name)} ${S.p[0].count}</b> &nbsp; · &nbsp; <b style="color:var(--p2)">${esc(S.p[1].name)} ${S.p[1].count}</b>` : "";
  ynSel="yes"; drawYN(); $("#finish").classList.add("on");
}
function drawYN(){ document.querySelectorAll("#finish .yn button").forEach(b=>b.classList.toggle("sel", b.dataset.yn===ynSel)); }
function choose(v){
  if(v==="view"){ viewScene(); return; }
  $("#finish").classList.remove("on");
  if(v==="yes"){ startGame(); }
  else { S.phase="setup"; S.p.forEach(p=>{p.count=0;p.done=false;}); S.winner=null; save(); drawSetup(); show("setup"); $("#msub").textContent="INSERT EFFORT TO CONTINUE"; }
}
document.querySelectorAll("#finish .yn button").forEach(b=>b.addEventListener("click", ()=>choose(b.dataset.yn)));

/* ================= INPUT ================= */
addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") { if(e.key==="Enter"){ e.target.blur(); } return; }
  if(finOn()){
    const ORD=["yes","no","view"];
    if(["ArrowLeft","ArrowRight","Tab"].includes(e.key)){ ynSel = ORD[(ORD.indexOf(ynSel)+(e.key==="ArrowLeft"?2:1))%3]; drawYN(); e.preventDefault(); return; }
    if(performance.now()-finOpenAt<1200 || e.repeat){ e.preventDefault(); return; }   // a last mashed press can't pick an option by accident
    if(e.key==="y"||e.key==="Y"){ choose("yes"); }
    else if(e.key==="n"||e.key==="N"){ choose("no"); }
    else if(e.key==="v"||e.key==="V"){ choose("view"); }
    else if(e.key===" "||e.key==="Enter"){ choose(ynSel); e.preventDefault(); }
    return;
  }
  if(S.phase==="done"){ e.preventDefault(); if(!e.repeat && performance.now()>finReadyAt) showFinish(); return; }
  if(S.phase==="setup"){ if(e.key==="Enter"){ startGame(); e.preventDefault(); } return; }
  if(S.phase!=="play" || e.repeat) return;   // one press = one count; holding a key does not repeat
  if(nP()===1 && e.code==="Space"){ press(0); e.preventDefault(); }
  else if(nP()===2 && e.code==="KeyZ"){ press(0); e.preventDefault(); }
  else if(nP()===2 && e.code==="KeyM"){ press(1); e.preventDefault(); }
});
// while looking at the finished scene, any tap or click brings the menu back
addEventListener("pointerdown", e=>{ if(S.phase==="done" && !finOn() && !e.target.closest("#reset") && performance.now()>finReadyAt) showFinish(); });
// touch / pen taps only (an iPad); mouse clicks on the Mac deliberately do NOT count
$("#squares").addEventListener("pointerdown", e=>{
  if(e.pointerType==="mouse") return;
  const sq=e.target.closest(".sq"); if(!sq) return; e.preventDefault();
  press(nP()===1 ? 0 : +sq.dataset.pi);
});
$("#teambar").addEventListener("pointerdown", e=>{ if(e.pointerType!=="mouse" && nP()===1) press(0); });
// reset needs two presses so a stray tap can't wipe a session (no pop-up dialogs)
let armT=null;
$("#reset").addEventListener("click", e=>{
  const b=e.currentTarget;
  if(!b.classList.contains("arm")){ b.classList.add("arm"); b.textContent="SURE? TAP AGAIN"; armT=setTimeout(()=>{ b.classList.remove("arm"); b.textContent="RESET"; }, 3000); return; }
  clearTimeout(armT); b.classList.remove("arm"); b.textContent="RESET"; choose("no");
});

/* ================= STARS ================= */
(function(){ const crt=document.getElementById("crt"), r=rng(42);
  for(let i=0;i<14;i++){ const s=document.createElement("i"); s.className="star";
    s.style.left=(4+r()*92)+"%"; s.style.top=(6+r()*88)+"%"; s.style.animationDelay=(r()*3).toFixed(2)+"s"; s.style.animationDuration=(2.2+r()*2.5).toFixed(2)+"s";
    crt.appendChild(s); } })();
/* ================= BOOT ================= */
drawSetup();
if(S.phase==="play"){ buildPlay(); show("play"); if(S.goalName) $("#msub").textContent=`NOW CLEANING: ${S.goalName}`; }
else if(S.phase==="done"){ buildPlay(); show("play"); showFinish(); }
else show("setup");
</script>
</body>
