<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS — Margin Notes</title>
  </head>
  <body>
    <!--
      Sveltia CMS. Pinned to v0.170.5 (released 10 Jul 2026) so a Sveltia
      release can't silently change our config surface. To upgrade, bump the
      version in the src URL below after reading the release notes at
      https://github.com/sveltia/sveltia-cms/releases

      Note: no type="module" attribute — Sveltia is not distributed as an ES
      module, and adding it breaks the JS API. No stylesheet link either;
      styles are bundled inside the JS.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.170.5/dist/sveltia-cms.js"></script>
  </body>
</html>
